[main]
font="Playpen Sans Light"
size=13
use-bold=no
dpi-aware=no
fields=name,generic,comment,categories,filename,keywords,exec
terminal=ghostty
prompt="Search:"
icon-theme=Papirus
icons-enabled=yes
show-actions=no
anchor=center
x-margin=10
y-margin=10
lines=7
width=60
horizontal-pad=30
vertical-pad=30
inner-pad=5
line-height=25
letter-spacing=0
image-size-ratio=0.2
layer=top
exit-on-keyboard-focus-loss = no

[colors]
background=00000055
prompt=ffffffff
input=ffffffff
text=ffffffff
match=76946aff
selection=ffffff55
selection-text=ffffffff
border=ffffffff

[border]
width=1
radius=28
